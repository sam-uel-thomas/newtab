// first line must be a comment
// Goes in Firefox's install folder next to the app:
//   macOS:   /Applications/Firefox.app/Contents/Resources/autoconfig.cfg
//   Windows: C:\Program Files\Mozilla Firefox\autoconfig.cfg
// The install scripts replace __NEWTAB_URL__ with the file:/// address of index.html in your clone.
const NEWTAB = "__NEWTAB_URL__";

// homepage + new tab page
pref("browser.startup.homepage", NEWTAB);
try {
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = NEWTAB;
} catch (e) { Components.utils.reportError(e); }

// private windows open the page as index.html#private (blue glow, cheeky greeting)
const NEWTAB_PRIVATE = NEWTAB + "#private";
let PrivateBrowsingUtils;
try {
  ({ PrivateBrowsingUtils } = ChromeUtils.importESModule("resource://gre/modules/PrivateBrowsingUtils.sys.mjs"));
  const { BrowserWindowTracker } = ChromeUtils.importESModule("resource:///modules/BrowserWindowTracker.sys.mjs");

  // the first tab of a new private window
  const openWindow = BrowserWindowTracker.openWindow;
  BrowserWindowTracker.openWindow = function (options = {}) {
    if (options.private && !options.args) {
      const args = Components.classes["@mozilla.org/supports-string;1"]
        .createInstance(Components.interfaces.nsISupportsString);
      args.data = NEWTAB_PRIVATE;
      options = { ...options, args };
    }
    return openWindow.call(this, options);
  };

  // every later new tab in that window, with the address bar kept empty
  Services.obs.addObserver(win => {
    if (!PrivateBrowsingUtils.isWindowPrivate(win)) return;
    const real = win.AboutNewTab;
    Object.defineProperty(win, "AboutNewTab", {
      configurable: true,
      value: new Proxy(real, {
        get(target, key) {
          if (key === "newTabURL") return NEWTAB_PRIVATE;
          const value = target[key];
          return typeof value === "function" ? value.bind(target) : value;
        }
      })
    });
    win.gInitialPages.push(NEWTAB);
  }, "browser-window-before-show");
} catch (e) { Components.utils.reportError(e); }

// give focus to the page (not the address bar) when the new tab page loads
try {
  Services.obs.addObserver(win => {
    // a new private window's first tab loads before the listener below exists
    if (PrivateBrowsingUtils?.isWindowPrivate(win) && win.gBrowser.currentURI.spec.startsWith(NEWTAB)) {
      win.setTimeout(() => win.gBrowser.selectedBrowser.focus(), 60);
    }
    win.gBrowser.addTabsProgressListener({
      onLocationChange(browser, progress, request, location) {
        if (!progress.isTopLevel || !location.spec.startsWith(NEWTAB)) return;
        if (browser !== win.gBrowser.selectedBrowser) return;
        win.setTimeout(() => browser.focus(), 60);
      }
    });
  }, "browser-delayed-startup-finished");
} catch (e) { Components.utils.reportError(e); }
